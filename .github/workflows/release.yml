name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
      - name: Validate tag and source version
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          $props = [xml](Get-Content Directory.Build.props)
          $source = $props.Project.PropertyGroup.Version
          if ($version -ne $source) { throw "Tag ${{ github.ref_name }} does not match Directory.Build.props version $source." }
      - name: Build all architectures
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          foreach ($arch in @("x86", "x64", "arm64")) { ./build/Package.ps1 -Architecture $arch -Version $version }
      - name: Run security tests
        run: dotnet test tests/Iris.Tests/Iris.Tests.csproj -c Release
      - name: Create draft GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          if (gh release view "${{ github.ref_name }}" --json tagName 2>$null) {
            gh release upload "${{ github.ref_name }}" artifacts/*/*.zip artifacts/*/*.sha256 --clobber
          } else {
            gh release create "${{ github.ref_name }}" artifacts/*/*.zip artifacts/*/*.sha256 --verify-tag --generate-notes --title "Iris $version" --draft
          }
      - name: Generate update metadata
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          ./build/Generate-UpdateMetadata.ps1 -Version $version -ArtifactsDirectory artifacts -OutputPath "$env:RUNNER_TEMP/update.json"
      - name: Publish update branch
        shell: pwsh
        run: |
          git fetch origin update:update-channel 2>$null
          if ($LASTEXITCODE -eq 0) { git switch update-channel } else { git switch --orphan update-channel; git rm -rf . }
          Copy-Item "$env:RUNNER_TEMP/update.json" update.json -Force
          git add update.json
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Update channel ${{ github.ref_name }}"
          git push origin HEAD:update
      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "${{ github.ref_name }}" --draft=false
